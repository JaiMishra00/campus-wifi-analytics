<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Campus WiFi Analytics</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .zone-tooltip {
      font-weight: bold;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  /* -------------------------------
     1. Create the map
  --------------------------------*/
  const map = L.map("map").setView(
    [26.1905, 91.6990], // <-- CHANGE to your campus center
    16
  );

  /* -------------------------------
     2. Base OSM layer
  --------------------------------*/
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  /* -------------------------------
     3. Zone color logic
  --------------------------------*/
  function zoneColor(category) {
    switch (category) {
      case "BUILDING":
        return "#1f77b4"; // blue
      case "HOSTEL":
        return "#9467bd"; // purple
      case "GROUND":
        return "#2ca02c"; // green
      case "OPEN_AREA":
        return "#ffcc00"; // yellow
      case "CAMPUS":
        return "#cccccc"; // grey
      default:
        return "#999999";
    }
  }

  /* -------------------------------
     4. Zone style
  --------------------------------*/
  function zoneStyle(feature) {
    return {
      color: "#333",
      weight: 1,
      fillColor: zoneColor(feature.properties.category),
      fillOpacity: 0.5
    };
  }

  /* -------------------------------
     5. Zone interactions
  --------------------------------*/
  function onEachZone(feature, layer) {
    const name = feature.properties.name || "Unnamed zone";

    // Hover tooltip
    layer.bindTooltip(name, {
      sticky: true,
      className: "zone-tooltip"
    });

    // Click popup
    layer.on("click", () => {
      layer.bindPopup(
        `<strong>${name}</strong><br/>
         Category: ${feature.properties.category}`
      ).openPopup();
    });

    // Hover highlight
    layer.on("mouseover", () => {
      layer.setStyle({
        weight: 3,
        fillOpacity: 0.7
      });
    });

    layer.on("mouseout", () => {
      layer.setStyle({
        weight: 1,
        fillOpacity: 0.5
      });
    });
  }

  /* -------------------------------
     6. Load GeoJSON zones
  --------------------------------*/
  fetch("zones.geojson")
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: zoneStyle,
        onEachFeature: onEachZone
      }).addTo(map);
    })
    .catch(err => {
      console.error("Failed to load zones:", err);
    });

</script>
</body>
</html>
